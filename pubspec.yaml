# App-icon generation from the circular brand icon. See assets/app_icon_circle.png.
# Alpha is kept so the transparent corners render as a true circle on the launcher.
flutter_launcher_icons:
  image_path: "assets/app_icon_circle.png"
  android: "ic_launcher"
  ios: true
  web:
    image_path: "assets/app_icon_circle.png"
