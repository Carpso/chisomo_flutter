name: kingdom_sponsor_app
description: "Kingdom Sponsor - neutral fundraising platform app."
publish_to: 'none'
version: 0.4.1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  go_router: ^17.1.0
  http: ^1.6.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^8.0.1
  lucide_icons: ^0.257.0
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  open_file: ^3.5.10
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  image_picker: ^1.2.2
  http_parser: ^4.1.2
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  sentry_flutter: ^9.14.0
  app_links: ^6.1.0
  cached_network_image: ^3.4.1
  shared_preferences: ^2.5.3
  permission_handler: 12.0.0
  flutter_local_notifications: ^20.1.0
  smooth_page_indicator: ^1.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/kingdom_sponsor_app_icon.jpg

# App-icon generation from the dedicated icon file. See assets/kingdom_sponsor_app_icon.jpg.
flutter_launcher_icons:
  image_path: "assets/kingdom_sponsor_app_icon.jpg"
  android: "ic_launcher"
  ios: true
  web:
    image_path: "assets/kingdom_sponsor_app_icon.jpg"
  remove_alpha: true
